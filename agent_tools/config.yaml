# Agent Configuration — azure_learning OKF Bundle
# ============================================================
# This file defines domain registries for all 3 coordinated agents.
# When you add new domains to the repository, update this file
# OR rely on auto-discovery (agents scan the filesystem).
#
# Usage: Edit this file → agents pick up changes on next run.
# Fields marked [auto] are discovered from the filesystem.
# Fields marked [manual] must be set here.

# ── Agent 1: Format Agent ───────────────────────────────────────────────────

# Type mapping: directory prefix → OKF type value
# [auto] New directories can be added here; agents also scan the filesystem.
type_mapping:
  # Core architecture
  "architecture-azure/": "Azure Service"
  "architecture-general/": "Architecture Pattern"

  # System design
  "system-design-architecture/": "System Design"

  # Reference
  "reference-dictionary/": "Reference"

  # Programming languages
  "programming-languages/": "Programming Guide"

  # Source articles
  "articles/medium/": "Article"
  "articles/linkedin/": "Article"
  "articles/personal-blogs/": "Article"
  "articles/substack/": "Article"

  # Other
  "videos/": "Video Notes"
  "site-reliability-engineering/": "SRE Guide"
  "unstructured-resources/": "Unstructured Note"

# Content placement signals — keywords that suggest a directory
# [manual] Edit to improve placement heuristics
placement_signals:
  azure:
    - azure
    - aks
    - event hub
    - cosmos db
    - key vault
    - service bus
    - event grid
