version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitepulse
      POSTGRES_USER: sitepulse_user
      POSTGRES_PASSWORD: sitepulse_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepulse_user -d sitepulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sitepulse-net

  adminer:
    image: adminer:latest
    container_name: sitepulse-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sitepulse-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitepulse-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sitepulse
      DB_USER: sitepulse_user
      DB_PASS: sitepulse_secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sitepulse-net
    profiles:
      - full

volumes:
  postgres_data:
    driver: local

networks:
  sitepulse-net:
    driver: bridge
