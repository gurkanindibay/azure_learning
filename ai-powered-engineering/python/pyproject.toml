[project]
name = "patchmaster-agent"
version = "0.1.0"
description = "A self-healing code review and refactoring agent demonstrating harness, loop, graph engineering, and evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
